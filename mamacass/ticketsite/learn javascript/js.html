        const productcards=document.querySelectorAll(".productcard")
        const selectedproduct=document.querySelector(".selectedproduct")
        productcards.forEach(function(productcard){
            const selectbtn=productcard.querySelector(".selectbtn");
            selectbtn.addEventListener("click",()=>{
                if (productcard.classList.contains("selected")) { 
                    productcard.classList.remove("selected"); 
                    selectbtn.textContent = "Select Product"; 
                    selectedproduct.textContent="No Product Selected"
                }

                     else { 
                        productcards.forEach((productcard) => { 
                        productcard.classList.remove("selected"); 
                        const productbtn = productcard.querySelector(".selectbtn"); 
                        productbtn.textContent = "Select Product"; }); 
                        productcard.classList.add("selected"); 
                        selectbtn.textContent = "Selected"; 
                    selectedproduct.textContent=
                    `Selected product: ${productcard.dataset.name}`;
                        }
                   
                });
     
                    });
